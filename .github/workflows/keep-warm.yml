name: keep-warm

# Keep the Render free-tier backend (hartford-grid-server) from spinning down.
# Render sleeps a free web service after ~15 min with no inbound traffic and then
# cold-starts in 30-60 s, which makes the simulator's server-side compute path
# slow on first use (the app falls back to slower in-browser compute meanwhile).
# This pings the server's /health endpoint on a schedule so the instance stays warm.
#
# Notes:
#   * GitHub delays scheduled runs under load, so the effective interval drifts.
#     If you still see cold starts, tighten the cron below to '*/5 * * * *'.
#   * GitHub auto-disables scheduled workflows after 60 days with no repo commits;
#     any push re-enables them, or run this manually from the Actions tab.
#   * Public repos get unlimited free Actions minutes, so this costs nothing.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC)
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (wake if asleep)
        run: |
          URL="https://hartford-grid-server.onrender.com/health"
          echo "Pinging $URL"
          # A cold free-tier instance can take 30-60 s to wake, so allow a long
          # per-attempt timeout and retry a few times before giving up.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && { echo "server is awake"; exit 0; }
            sleep 15
          done
          # Do not fail the run on a single missed ping: the next scheduled run
          # retries, and a red X here would just create noise.
          echo "no 200 yet (server may still be waking); next run will retry"
          exit 0
